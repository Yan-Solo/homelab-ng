---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Not "barpath": the manifest-apps ApplicationSet (kubernetes/manifests/*)
  # already generates its own wrapper Application named after this directory
  # ("barpath", from path.basename) to apply the raw manifests found here -
  # including this file. Naming this Application "barpath" too would collide:
  # same apiVersion/kind/name/namespace as that wrapper, so the ApplicationSet
  # controller and this Application's own resource sync would fight over the
  # same object's spec.source, and whichever won at a given moment determined
  # whether cloudnative-pg.yaml in this same folder ever actually got applied.
  name: barpath-platform
  namespace: argocd
spec:
  project: default
  source:
    # The chart lives in the barpath repo itself, not vendored here.
    repoURL: https://github.com/barpath-coach/platform.git
    targetRevision: HEAD
    path: deploy/helm/platform
    helm:
      # releaseName "platform" keeps resource names short (platform-auth,
      # platform-dashboard, ...) via platform.fullname in _helpers.tpl -
      # otherwise it'd default to the Application name "barpath-platform" and
      # double up as barpath-platform-platform-auth etc.
      releaseName: platform
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: barpath
  syncPolicy:
    syncOptions:
      - RespectIgnoreDifferences=true
      - CreateNamespace=true
      - ServerSideApply=true
      - ServerSideDiff=true
    automated:
      prune: true
      selfHeal: true
