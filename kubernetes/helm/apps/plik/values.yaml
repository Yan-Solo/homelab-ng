app-template:
  defaultPodOptions:
    enableServiceLinks: false
    securityContext:
      # Container runs as user plik (UID/GID 1000)
      fsGroup: 1000
      fsGroupChangePolicy: "OnRootMismatch"

  controllers:
    main:
      containers:
        main:
          image:
            repository: rootgg/plik
            tag: 1.4.3
          env:
            TZ: Europe/Brussels

            # Store uploaded files and SQLite metadata on the persistent volume
            PLIKD_DATA_BACKEND: file
            PLIKD_DATA_BACKEND_CONFIG: '{"Directory":"/data/files"}'
            PLIKD_METADATA_BACKEND_CONFIG: '{"Driver":"sqlite3","ConnectionString":"/data/plik.db"}'

            # Require login to upload; download links stay public
            PLIKD_FEATURE_AUTHENTICATION: forced

            # Upload limits
            PLIKD_MAX_FILE_SIZE_STR: 10GB
            PLIKD_DEFAULT_TTL_STR: 7d
            PLIKD_MAX_TTL_STR: 30d

          probes:
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8080
                initialDelaySeconds: 5
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 5
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8080
                initialDelaySeconds: 5
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 5

  service:
    main:
      controller: main
      ports:
        http:
          port: 80
          targetPort: 8080

  route:
    main:
      enabled: true
      kind: HTTPRoute
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
      hostnames:
        - plik.sunnyvale.be
      parentRefs:
        - name: envoy-gateway
          namespace: default
          sectionName: https

  persistence:
    # Uploaded files and SQLite metadata database
    data:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 50Gi
      storageClass: local-path-ssd
      globalMounts:
        - path: /data
