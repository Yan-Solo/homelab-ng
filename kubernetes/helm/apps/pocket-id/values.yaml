app-template:
  defaultPodOptions:
    enableServiceLinks: false
    securityContext:
      # Entrypoint drops to PUID/PGID, which default to 1000
      fsGroup: 1000
      fsGroupChangePolicy: "OnRootMismatch"

  controllers:
    main:
      containers:
        main:
          image:
            repository: ghcr.io/pocket-id/pocket-id
            tag: v2.19.1
          env:
            TZ: Europe/Brussels

            # Passkeys are bound to this domain, changing it invalidates them
            APP_URL: https://id.sunnyvale.be

            # Trust X-Forwarded-For from envoy, which runs in the pod network
            TRUST_PROXY: 10.1.0.0/16

            # Created manually, see the README
            ENCRYPTION_KEY:
              valueFrom:
                secretKeyRef:
                  name: pocket-id
                  key: ENCRYPTION_KEY

          probes:
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz
                  port: 1411
                initialDelaySeconds: 5
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 5
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz
                  port: 1411
                initialDelaySeconds: 5
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 5

  service:
    main:
      controller: main
      ports:
        http:
          port: 80
          targetPort: 1411

  route:
    main:
      enabled: true
      kind: HTTPRoute
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
      hostnames:
        - id.sunnyvale.be
      parentRefs:
        - name: envoy-gateway
          namespace: default
          sectionName: https

  persistence:
    # SQLite database and uploads
    data:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 1Gi
      storageClass: local-path-ssd
      globalMounts:
        - path: /app/data
