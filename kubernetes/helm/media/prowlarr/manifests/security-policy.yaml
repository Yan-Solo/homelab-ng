---
# Pocket ID handles authentication, Prowlarr's own auth is disabled
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: prowlarr-oidc
  namespace: media
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: prowlarr
  oidc:
    provider:
      issuer: https://id.sunnyvale.be
    clientID: prowlarr
    # Created manually, see the README
    clientSecret:
      name: prowlarr-oidc
    redirectURL: https://prowlarr.sunnyvale.be/oauth2/callback
    logoutPath: /oauth2/logout
