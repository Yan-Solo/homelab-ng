---
# Pocket ID handles authentication, qBittorrent's own auth is disabled
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: qbittorrent-oidc
  namespace: media
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: qbittorrent
  oidc:
    provider:
      issuer: https://id.sunnyvale.be
    clientID: qbittorrent
    # Created manually, see the README
    clientSecret:
      name: qbittorrent-oidc
    redirectURL: https://qbit.sunnyvale.be/oauth2/callback
    logoutPath: /oauth2/logout
