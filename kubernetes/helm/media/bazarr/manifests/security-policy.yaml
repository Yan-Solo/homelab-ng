---
# Pocket ID handles authentication, Bazarr's own auth is disabled
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: bazarr-oidc
  namespace: media
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: bazarr
  oidc:
    provider:
      issuer: https://id.sunnyvale.be
    clientID: bazarr
    # Created manually, see the README
    clientSecret:
      name: bazarr-oidc
    redirectURL: https://bazarr.sunnyvale.be/oauth2/callback
    logoutPath: /oauth2/logout
