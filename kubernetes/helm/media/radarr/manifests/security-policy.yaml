---
# Pocket ID handles authentication, Radarr's own auth is disabled
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: radarr-oidc
  namespace: media
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: radarr
  oidc:
    provider:
      issuer: https://id.sunnyvale.be
    clientID: radarr
    # Created manually, see the README
    clientSecret:
      name: radarr-oidc
    redirectURL: https://radarr.sunnyvale.be/oauth2/callback
    logoutPath: /oauth2/logout
