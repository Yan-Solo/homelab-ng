app-template:
    controllers:
        main:
            containers:
                main:
                    image:
                        repository: ghcr.io/advplyr/audiobookshelf
                        tag: 2.36.0
    service:
        main:
            controller: main
            ports:
                http:
                    port: 80
                    targetPort: 80
    route:
        main:
            enabled: true
            kind: HTTPRoute
            hostnames:
                - audiobookshelf.sunnyvale.be
    persistence:
        config:
            enabled: true
            type: persistentVolumeClaim
            accessMode: ReadWriteOnce
            size: 1Gi
            storageClass: local-path-ssd
            globalMounts:
                - path: /config
        metadata:
            enabled: true
            type: persistentVolumeClaim
            accessMode: ReadWriteOnce
            size: 1Gi
            storageClass: local-path-ssd
            globalMounts:
                - path: /metadata
        media:
            enabled: true
            type: persistentVolumeClaim
            existingClaim: "media"
            globalMounts:
                - path: /audiobooks
