argo-cd:
  server:
    service:
      annotations:
        tailscale.com/expose: "true"
        tailscale.com/hostname: "argocd"
    replicas: 1
    pdb:
      enabled: true
      minAvailable: 1
    extraArgs:
      - "--insecure"
    httproute:
      enabled: true
      annotations:
        # Only expose the route once the server has restarted with auth enabled
        argocd.argoproj.io/sync-wave: "1"
      hostnames:
        - argocd.sunnyvale.be
      parentRefs:
        - name: envoy-gateway
          namespace: default
          sectionName: https
  configs:
    params:
      applicationsetcontroller.policy: "create-only"
      server.disable.auth: false
      server.insecure: true
    rbac:
      policy.csv: |
        g, admins, role:admin
    cm:
      admin.enabled: "false"
      url: https://argocd.sunnyvale.be
      oidc.config: |
        name: Pocket ID
        issuer: https://id.sunnyvale.be
        clientID: argocd
        clientSecret: $argocd-oidc:clientSecret
        requestedScopes:
          - openid
          - profile
          - email
          - groups
      exec.enabled: "true"
      resource.compareoptions: |
        ignoreAggregatedRoles: true
        ignoreResourceStatusField: all
      server.insecure: true
  controller:
    replicas: 1
    pdb:
      enabled: true
      minAvailable: 1
  repoServer:
    replicas: 1
  applicationSet:
    replicaCount: 1
  dex:
    enabled: true
    pdb:
      enabled: true
      minAvailable: 1
  global:
    priorityClassName: system-cluster-critical
