apiVersion: v1
kind: ConfigMap
metadata:
  name: frigate-config
data:
  # Initial config only: copied to /config/config.yml on first start, edit it in the Frigate UI afterwards
  config.yml: |
    # TLS is terminated at the envoy gateway
    tls:
      enabled: false

    mqtt:
      enabled: true
      host: mosquitto
      port: 1883

    detectors:
      ov:
        type: openvino
        device: GPU

    model:
      width: 300
      height: 300
      input_tensor: nhwc
      input_pixel_format: bgr
      path: /openvino-model/ssdlite_mobilenet_v2.xml
      labelmap_path: /openvino-model/coco_91cl_bkgr.txt

    ffmpeg:
      hwaccel_args: preset-vaapi

    record:
      enabled: true
      retain:
        days: 7
        mode: motion

    snapshots:
      enabled: true
      retain:
        default: 14

    go2rtc:
      streams: {}

    cameras: {}
    # cameras:
    #   front_door:
    #     ffmpeg:
    #       inputs:
    #         - path: rtsp://user:pass@192.168.0.x:554/stream1
    #           roles:
    #             - detect
    #             - record
